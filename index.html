<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better Days</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Better Days">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}
a{color:#409CFF}a:hover{color:#7AB8FF}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ln{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tr{stroke:#409CFF;stroke-width:2;stroke-dasharray:5 4;fill:none}
.gr{stroke:#48484A;stroke-width:1;stroke-dasharray:2 3}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trkB{fill:none;stroke-width:13;opacity:.22}
.rgB{fill:none;stroke-width:13;stroke-linecap:round}
.trkS{fill:none;stroke-width:3.5;opacity:.22}
.rgS{fill:none;stroke-width:3.5;stroke-linecap:round}
textarea{font-family:inherit}
textarea::placeholder{color:#8E8E93}
input::placeholder{color:#8E8E93}
input,select{font-family:inherit}

html,body{height:100%;margin:0;background:#000;color:#fff;overscroll-behavior:none}
#root{position:fixed;inset:0}
button,a{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
*{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif; position: relative; overflow: hidden">

<div class="scroller" style="flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top); {{scrollPad}}">

<!-- ================= SUMMARY ================= -->
<sc-if value="{{show.summary}}" hint-placeholder-val="{{true}}">
<div style="padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #98989F">{{todayLabel}}</span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Summary</h1>
      <button onClick="{{goSettings}}" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1C1C1E; color: #C7C7CC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
    </div>
  </div>

  <sc-if value="{{noData}}" hint-placeholder-val="{{false}}">
    <div style="background: #1C1C1E; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 20px; font-weight: 800">Welcome to Better Days</span>
      <span style="font-size: 15px; color: #C7C7CC; line-height: 1.45">Each night, rate today's 15 factors, plan tomorrow and review your to-dos. Your rings, grades and trends fill in from there.</span>
      <button onClick="{{goInput}}" style="min-height: 50px; border-radius: 14px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 17px; font-weight: 700">Start Tonight's Check-in</button>
    </div>
  </sc-if>
  <sc-if value="{{hasData}}" hint-placeholder-val="{{true}}">
  <button onClick="{{openLatest}}" style="text-align: left; background: #1C1C1E; border: none; border-radius: 20px; padding: 16px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
      <span style="font-size: 17px; font-weight: 700">{{lat.label}}</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #98989F">{{lat.date}}<svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; width: 100%">
      <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Pillar rings">
        <sc-for list="{{lat.rings}}" as="g" hint-placeholder-count="3">
          <circle cx="75" cy="75" r="{{g.r}}" stroke="{{g.col}}" class="trkB"></circle>
          <circle cx="75" cy="75" r="{{g.r}}" stroke="{{g.col}}" transform="rotate(-90 75 75)" class="rgB" style="stroke-dasharray: {{g.dash}}"></circle>
        </sc-for>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 38px; font-weight: 800; line-height: 1; color: {{lat.b.bg}}">{{lat.b.letter}}</span>
          <span style="font-size: 22px; font-weight: 700">{{lat.b.pct}}</span>
        </div>
        <sc-for list="{{lat.pillars}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 12px; font-weight: 600; color: #98989F">{{p.name}}</span>
            <span style="font-size: 17px; font-weight: 700; color: {{p.b.bg}}">{{p.b.pct}} {{p.b.letter}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; color: #98989F">{{lat.b.missed}} left on the table · <span style="font-weight: 700; color: {{lat.d.col}}">{{lat.d.txt}}</span> vs previous day</div>
  </button>
  </sc-if>

  <sc-if value="{{vdb.show}}" hint-placeholder-val="{{true}}">
  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 15px; font-weight: 700">{{vdb.title}}</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{vdb.rows}}" as="r" hint-placeholder-count="4">
        <div style="background: #2C2C2E; border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px">
          <span style="font-size: 11px; font-weight: {{r.weight}}; color: #98989F">{{r.name}}</span>
          <span style="font-size: 17px; font-weight: 800; color: {{r.b.bg}}">{{r.b.pct}}</span>
          <span style="font-size: 12px; font-weight: 700; color: {{r.d.col}}">{{r.d.txt}}</span>
          <span style="font-size: 10px; color: #98989F">{{r.exp}}</span>
        </div>
      </sc-for>
    </div>
    <sc-for list="{{vdb.lines}}" as="h" hint-placeholder-count="2">
      <div style="display: flex; gap: 10px; align-items: center">
        <span style="width: 8px; height: 8px; border-radius: 4px; flex: none; background: {{h.col}}"></span>
        <span style="font-size: 14px">{{h.txt}}</span>
      </div>
    </sc-for>
  </div>
  </sc-if>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700; padding: 0 4px">Previous 7 Days</span>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="background: transparent; border: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; min-height: 44px">
          <span style="font-size: 12px; font-weight: 600; color: #98989F">{{d.wd}}</span>
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <sc-for list="{{d.rings}}" as="g" hint-placeholder-count="3">
              <circle cx="20" cy="20" r="{{g.r}}" stroke="{{g.col}}" class="trkS"></circle>
              <circle cx="20" cy="20" r="{{g.r}}" stroke="{{g.col}}" transform="rotate(-90 20 20)" class="rgS" style="stroke-dasharray: {{g.dash}}"></circle>
            </sc-for>
          </svg>
          <span style="font-size: 12px; font-weight: 700; color: {{d.col}}">{{d.letter}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="background: #1C1C1E; border-radius: 20px; overflow: hidden">
    <button onClick="{{attn.toggle}}" aria-expanded="{{attn.openStr}}" style="width: 100%; background: transparent; border: none; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 60px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">{{attn.title}}</span>
        <span style="font-size: 13px; color: #98989F">{{attn.sub}}</span>
      </div>
      <span style="font-size: 22px; font-weight: 800; color: {{attn.valCol}}">{{attn.val}}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="color: #8E8E93; transform: rotate({{attn.rot}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <sc-if value="{{attn.open}}" hint-placeholder-val="{{false}}">
      <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{latRecs.pillars}}" as="p" hint-placeholder-count="1">
          <div style="font-size: 14px; font-weight: 700; color: #FF6961">{{p}}</div>
        </sc-for>
        <sc-for list="{{latRecs.items}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px; align-items: flex-start; padding-top: 10px; border-top: 1px solid #38383A">
            <span style="font-size: 15px; font-weight: 800; min-width: 34px; color: {{r.bg}}">{{r.score}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
              <sc-if value="{{tipsOn}}" hint-placeholder-val="{{true}}">
                <sc-if value="{{r.hasTip}}" hint-placeholder-val="{{true}}">
                  <span style="font-size: 14px; color: #E5E5EA; line-height: 1.4">{{r.tip}}</span>
                  <span style="font-size: 12px; color: #98989F; font-style: italic">— {{r.author}}, {{r.work}}</span>
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                    <a href="{{r.url}}" target="_blank" rel="noopener" style="font-size: 13px; font-weight: 600; color: #409CFF; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center">Open source ›</a>
                    <button onClick="{{r.next}}" style="display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #2C2C2E; color: #409CFF; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>New tip</button>
                  </div>
                </sc-if>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{tipsOff}}" hint-placeholder-val="{{false}}">
          <div style="background: #2C2C2E; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #C7C7CC">Connect to the internet to see tips.</div>
        </sc-if>
        <sc-if value="{{latSafety}}" hint-placeholder-val="{{false}}">
          <div style="background: #0A2A4A; border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.45">Your emotional scores were low. If this keeps up, it can help to talk with someone you trust or a professional. If you're ever in crisis, call or text <strong>988</strong> (US).</div>
        </sc-if>
      </div>
    </sc-if>
  </div>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700">Highlights</span>
    <sc-for list="{{highlights}}" as="h" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span style="width: 8px; height: 8px; border-radius: 4px; margin-top: 6px; flex: none; background: {{h.col}}"></span>
        <span style="font-size: 15px; line-height: 1.35">{{h.txt}}</span>
      </div>
    </sc-for>
  </div>

  <sc-for list="{{sections}}" as="x" hint-placeholder-count="3">
    <div style="background: #1C1C1E; border-radius: 20px; overflow: hidden">
      <button onClick="{{x.toggle}}" aria-expanded="{{x.openStr}}" style="width: 100%; background: transparent; border: none; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 60px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">{{x.title}}</span>
          <span style="font-size: 13px; color: #98989F">{{x.sub}}</span>
        </div>
        <span style="font-size: 22px; font-weight: 800; color: {{x.valCol}}">{{x.val}}</span>
        <span style="font-size: 13px; font-weight: 700; color: {{x.d.col}}">{{x.d.txt}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="color: #8E8E93; transform: rotate({{x.rot}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <sc-if value="{{x.openChart}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #2C2C2E; border-radius: 10px; padding: 2px" role="group" aria-label="Filter by pillar">
            <sc-for list="{{filters}}" as="c" hint-placeholder-count="4">
              <button onClick="{{c.pick}}" style="min-height: 32px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; {{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
          <svg width="326" height="96" viewBox="0 0 326 96" role="img" aria-label="Daily scores graph">
            <line x1="0" x2="326" y1="{{x.c.y70}}" y2="{{x.c.y70}}" class="gr"></line>
            <path d="{{x.c.path}}" class="ln"></path>
            <line x1="{{x.c.t.x1}}" y1="{{x.c.t.y1}}" x2="{{x.c.t.x2}}" y2="{{x.c.t.y2}}" class="tr" opacity="{{x.c.t.op}}"></line>
            <sc-for list="{{x.c.dots}}" as="d" hint-placeholder-count="7">
              <circle cx="{{d.cx}}" cy="{{d.cy}}" r="{{x.c.r}}" fill="{{d.fill}}"></circle>
            </sc-for>
          </svg>
          <span style="font-size: 12px; color: #98989F">{{x.caption}}</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{x.pill}}" as="p" hint-placeholder-count="3">
              <div style="background: #2C2C2E; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 600; color: #98989F">{{p.name}}</span>
                <span style="font-size: 17px; font-weight: 800; color: {{p.b.bg}}">{{p.b.pct}} {{p.b.letter}}</span>
                <span style="font-size: 12px; font-weight: 700; color: {{p.d.col}}">{{p.d.txt}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{x.openBig}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 16px 14px; display: flex; flex-direction: column">
          <sc-for list="{{big3}}" as="f" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #38383A">
              <div style="flex: 1; display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 700">{{f.name}}</span>
                <span style="font-size: 12px; color: #98989F">{{f.pillar}} · 30-day avg {{f.avg30}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 700; color: {{f.d.col}}">{{f.d.txt}}</span>
              <span style="font-size: 20px; font-weight: 800; color: {{f.b.bg}}">{{f.avg}}</span>
            </div>
          </sc-for>
          <span style="font-size: 12px; color: #98989F; padding-top: 4px">7-day averages. Focus factors count 20% more this week.</span>
        </div>
      </sc-if>

    </div>
  </sc-for>
</div>
</sc-if>

<!-- ================= CHECK-IN ================= -->
<sc-if value="{{show.input}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px">

  <sc-if value="{{iv.isReview}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
        <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F">{{rv.title}}</span>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Check-in</h1>
      </div>
      <button onClick="{{rv.start}}" style="min-height: 56px; border-radius: 16px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 18px; font-weight: 700">{{rv.btn}}</button>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 0">
        <span style="font-size: 20px; font-weight: 800">{{rv.head}}</span>
      </div>
      <span style="font-size: 13px; color: #98989F; padding: 0 4px; margin-top: -6px">Check things off anytime today. They also show on each pillar's rating pages.</span>
      <sc-if value="{{rv.empty}}" hint-placeholder-val="{{false}}"><div style="background: #1C1C1E; border-radius: 16px; padding: 14px 16px; font-size: 14px; color: #98989F">Nothing due. Add to-dos in Planner.</div></sc-if>
      <sc-for list="{{rv.groups}}" as="g" hint-placeholder-count="3">
        <div style="background: #1C1C1E; border-radius: 20px; padding: 6px 16px 8px; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 0">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: {{g.col}}"></span>
            <span style="flex: 1; font-size: 15px; font-weight: 700; color: {{g.col}}">{{g.name}}</span>
            <span style="font-size: 13px; color: #98989F">{{g.count}}</span>
          </div>
          <sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border-top: 1px solid #38383A">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 16px; font-weight: 600">{{t.text}}</span>
                <sc-if value="{{t.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #98989F">{{t.sub}}</span></sc-if>
              </div>
              <button onClick="{{t.yes}}" aria-label="{{t.yesAria}}" aria-pressed="{{t.yesP}}" style="width: 44px; height: 44px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; {{t.yesStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></button>
              <button onClick="{{t.no}}" aria-label="{{t.noAria}}" aria-pressed="{{t.noP}}" style="width: 44px; height: 44px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; {{t.noStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{iv.isPlan}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; min-height: 44px">
        <button onClick="{{back}}" style="background: transparent; border: none; color: #409CFF; font-size: 17px; display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Awareness</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
        <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F">Step 3 of 3 · {{pn.dateLabel}}</span>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Plan Tomorrow</h1>
      </div>
      <div style="background: #1C1C1E; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 8px">
          <label for="plantask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New task for tomorrow</label>

<!-- ================= ADD TO-DO SHEET ================= -->
<sc-if value="{{ad.open}}" hint-placeholder-val="{{false}}">

        <span style="font-size: 17px; font-weight: 700">{{ad.title}}</span>

          <button onClick="{{r.pick}}" aria-pressed="{{r.selStr}}" style="min-height: 36px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; {{r.style}}">{{r.label}}</button>

      <div style="display: flex; align-items: center; justify-content: space-between">

    </div>
  </div>
