<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better Days</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Better Days">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}
a{color:#409CFF}a:hover{color:#7AB8FF}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ln{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tr{stroke:#409CFF;stroke-width:2;stroke-dasharray:5 4;fill:none}
.gr{stroke:#48484A;stroke-width:1;stroke-dasharray:2 3}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trkB{fill:none;stroke-width:13;opacity:.22}
.rgB{fill:none;stroke-width:13;stroke-linecap:round}
.trkS{fill:none;stroke-width:3.5;opacity:.22}
.rgS{fill:none;stroke-width:3.5;stroke-linecap:round}
textarea{font-family:inherit}
textarea::placeholder{color:#8E8E93}
input::placeholder{color:#8E8E93}
input,select{font-family:inherit}

html,body{height:100%;margin:0;background:#000;color:#fff;overscroll-behavior:none}
#root{position:fixed;inset:0}
button,a{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
*{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif; position: relative; overflow: hidden">

<div class="scroller" style="flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top); {{scrollPad}}">

<!-- ================= SUMMARY ================= -->
<sc-if value="{{show.summary}}" hint-placeholder-val="{{true}}">
<div style="padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #98989F">{{todayLabel}}</span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Summary</h1>
      <button onClick="{{goSettings}}" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1C1C1E; color: #C7C7CC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
    </div>
  </div>

  <sc-if value="{{noData}}" hint-placeholder-val="{{false}}">
    <div style="background: #1C1C1E; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 20px; font-weight: 800">Welcome to Better Days</span>
      <span style="font-size: 15px; color: #C7C7CC; line-height: 1.45">Each night, rate today's 15 factors, plan tomorrow and review your to-dos. Your rings, grades and trends fill in from there.</span>
      <button onClick="{{goInput}}" style="min-height: 50px; border-radius: 14px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 17px; font-weight: 700">Start Tonight's Check-in</button>
    </div>
  </sc-if>
  <sc-if value="{{hasData}}" hint-placeholder-val="{{true}}">
  <button onClick="{{openLatest}}" style="text-align: left; background: #1C1C1E; border: none; border-radius: 20px; padding: 16px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
      <span style="font-size: 17px; font-weight: 700">{{lat.label}}</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #98989F">{{lat.date}}<svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; width: 100%">
      <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Pillar rings">
        <sc-for list="{{lat.rings}}" as="g" hint-placeholder-count="3">
          <circle cx="75" cy="75" r="{{g.r}}" stroke="{{g.col}}" class="trkB"></circle>
          <circle cx="75" cy="75" r="{{g.r}}" stroke="{{g.col}}" transform="rotate(-90 75 75)" class="rgB" style="stroke-dasharray: {{g.dash}}"></circle>
        </sc-for>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 38px; font-weight: 800; line-height: 1; color: {{lat.b.bg}}">{{lat.b.letter}}</span>
          <span style="font-size: 22px; font-weight: 700">{{lat.b.pct}}</span>
        </div>
        <sc-for list="{{lat.pillars}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 12px; font-weight: 600; color: #98989F">{{p.name}}</span>
            <span style="font-size: 17px; font-weight: 700; color: {{p.b.bg}}">{{p.b.pct}} {{p.b.letter}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; color: #98989F">{{lat.b.missed}} left on the table · <span style="font-weight: 700; color: {{lat.d.col}}">{{lat.d.txt}}</span> vs previous day</div>
  </button>
  </sc-if>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700; padding: 0 4px">Previous 7 Days</span>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="background: transparent; border: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; min-height: 44px">
          <span style="font-size: 12px; font-weight: 600; color: #98989F">{{d.wd}}</span>
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <sc-for list="{{d.rings}}" as="g" hint-placeholder-count="3">
              <circle cx="20" cy="20" r="{{g.r}}" stroke="{{g.col}}" class="trkS"></circle>
              <circle cx="20" cy="20" r="{{g.r}}" stroke="{{g.col}}" transform="rotate(-90 20 20)" class="rgS" style="stroke-dasharray: {{g.dash}}"></circle>
            </sc-for>
          </svg>
          <span style="font-size: 12px; font-weight: 700; color: {{d.col}}">{{d.letter}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700">Highlights</span>
    <sc-for list="{{highlights}}" as="h" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span style="width: 8px; height: 8px; border-radius: 4px; margin-top: 6px; flex: none; background: {{h.col}}"></span>
        <span style="font-size: 15px; line-height: 1.35">{{h.txt}}</span>
      </div>
    </sc-for>
  </div>

  <sc-for list="{{sections}}" as="x" hint-placeholder-count="4">
    <div style="background: #1C1C1E; border-radius: 20px; overflow: hidden">
      <button onClick="{{x.toggle}}" aria-expanded="{{x.openStr}}" style="width: 100%; background: transparent; border: none; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 60px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">{{x.title}}</span>
          <span style="font-size: 13px; color: #98989F">{{x.sub}}</span>
        </div>
        <span style="font-size: 22px; font-weight: 800; color: {{x.valCol}}">{{x.val}}</span>
        <span style="font-size: 13px; font-weight: 700; color: {{x.d.col}}">{{x.d.txt}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="color: #8E8E93; transform: rotate({{x.rot}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <sc-if value="{{x.openChart}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #2C2C2E; border-radius: 10px; padding: 2px" role="group" aria-label="Filter by pillar">
            <sc-for list="{{filters}}" as="c" hint-placeholder-count="4">
              <button onClick="{{c.pick}}" style="min-height: 32px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; {{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
          <svg width="326" height="96" viewBox="0 0 326 96" role="img" aria-label="Daily scores graph">
            <line x1="0" x2="326" y1="{{x.c.y70}}" y2="{{x.c.y70}}" class="gr"></line>
            <path d="{{x.c.path}}" class="ln"></path>
            <line x1="{{x.c.t.x1}}" y1="{{x.c.t.y1}}" x2="{{x.c.t.x2}}" y2="{{x.c.t.y2}}" class="tr" opacity="{{x.c.t.op}}"></line>
            <sc-for list="{{x.c.dots}}" as="d" hint-placeholder-count="7">
              <circle cx="{{d.cx}}" cy="{{d.cy}}" r="{{x.c.r}}" fill="{{d.fill}}"></circle>
            </sc-for>
          </svg>
          <span style="font-size: 12px; color: #98989F">{{x.caption}}</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{x.pill}}" as="p" hint-placeholder-count="3">
              <div style="background: #2C2C2E; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 600; color: #98989F">{{p.name}}</span>
                <span style="font-size: 17px; font-weight: 800; color: {{p.b.bg}}">{{p.b.pct}} {{p.b.letter}}</span>
                <span style="font-size: 12px; font-weight: 700; color: {{p.d.col}}">{{p.d.txt}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{x.openBig}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 16px 14px; display: flex; flex-direction: column">
          <sc-for list="{{big3}}" as="f" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #38383A">
              <div style="flex: 1; display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 700">{{f.name}}</span>
                <span style="font-size: 12px; color: #98989F">{{f.pillar}} · 30-day avg {{f.avg30}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 700; color: {{f.d.col}}">{{f.d.txt}}</span>
              <span style="font-size: 20px; font-weight: 800; color: {{f.b.bg}}">{{f.avg}}</span>
            </div>
          </sc-for>
          <span style="font-size: 12px; color: #98989F; padding-top: 4px">7-day averages. Focus factors count 20% more this week.</span>
        </div>
      </sc-if>

      <sc-if value="{{x.openAttn}}" hint-placeholder-val="{{false}}">
        <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{latRecs.pillars}}" as="p" hint-placeholder-count="1">
            <div style="font-size: 14px; font-weight: 700; color: #FF6961">{{p}}</div>
          </sc-for>
          <sc-for list="{{latRecs.items}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; align-items: flex-start; padding-top: 10px; border-top: 1px solid #38383A">
              <span style="font-size: 15px; font-weight: 800; min-width: 34px; color: {{r.bg}}">{{r.score}}</span>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
                <sc-if value="{{tipsOn}}" hint-placeholder-val="{{true}}">
                  <sc-if value="{{r.hasTip}}" hint-placeholder-val="{{true}}">
                    <span style="font-size: 14px; color: #E5E5EA; line-height: 1.4">{{r.tip}}</span>
                    <span style="font-size: 12px; color: #98989F; font-style: italic">— {{r.author}}, {{r.work}}</span>
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                      <a href="{{r.url}}" target="_blank" rel="noopener" style="font-size: 13px; font-weight: 600; color: #409CFF; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center">Open source ›</a>
                      <button onClick="{{r.next}}" style="display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #2C2C2E; color: #409CFF; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>New tip</button>
                    </div>
                  </sc-if>
                  <sc-if value="{{r.noTip}}" hint-placeholder-val="{{false}}">
                    <span style="font-size: 14px; color: #98989F">No new tips for {{r.name}} right now. Check back later.</span>
                  </sc-if>
                </sc-if>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{tipsOff}}" hint-placeholder-val="{{false}}">
            <div style="background: #2C2C2E; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #C7C7CC">Connect to the internet to see tips.</div>
          </sc-if>
          <sc-if value="{{latSafety}}" hint-placeholder-val="{{false}}">
            <div style="background: #0A2A4A; border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.45">Your emotional scores were low. If this keeps up, it can help to talk with someone you trust or a professional. If you're ever in crisis, call or text <strong>988</strong> (US).</div>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</sc-if>

<!-- ================= CHECK-IN ================= -->
<sc-if value="{{show.input}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px">

  <sc-if value="{{iv.isReview}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
        <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F">Step 1 of 3 · {{iv.dateLabel}}</span>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Review Tasks</h1>
        <span style="font-size: 15px; color: #98989F">Check off what got done before you rate the day.</span>
      </div>
      <div style="background: #1C1C1E; border-radius: 20px; padding: 6px 16px 8px; display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 700; padding: 8px 0">{{rv.head}}</span>
        <sc-if value="{{rv.empty}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: #98989F; padding: 8px 0 10px; border-top: 1px solid #38383A">Nothing was planned for this day.</span></sc-if>
        <sc-for list="{{rv.tasks}}" as="t" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border-top: 1px solid #38383A">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 16px; font-weight: 600">{{t.text}}</span>
              <sc-if value="{{t.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #98989F">{{t.sub}}</span></sc-if>
            </div>
            <button onClick="{{t.yes}}" aria-label="{{t.yesAria}}" aria-pressed="{{t.yesP}}" style="width: 44px; height: 36px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; {{t.yesStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></button>
            <button onClick="{{t.no}}" aria-label="{{t.noAria}}" aria-pressed="{{t.noP}}" style="width: 44px; height: 36px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; {{t.noStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
        </sc-for>
      </div>
      <button onClick="{{startQs}}" style="min-height: 52px; border-radius: 14px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 17px; font-weight: 700">Rate My Day</button>
    </div>
  </sc-if>

  <sc-if value="{{iv.isPlan}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; min-height: 44px">
        <button onClick="{{back}}" style="background: transparent; border: none; color: #409CFF; font-size: 17px; display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Awareness</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
        <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F">Step 3 of 3 · {{pn.dateLabel}}</span>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Plan Tomorrow</h1>
      </div>
      <div style="background: #1C1C1E; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 8px">
          <label for="plantask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New task for tomorrow</label>
          <input id="plantask" type="text" value="{{pn.draft.text}}" onChange="{{pn.draft.onText}}" onKeyDown="{{pn.draft.onKey}}" placeholder="Add a task for tomorrow" style="flex: 1; min-width: 0; min-height: 44px; border-radius: 10px; border: none; background: #2C2C2E; color: #FFFFFF; padding: 0 12px; font-size: 16px">
          <button onClick="{{pn.draft.add}}" aria-label="Add task" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #0A84FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 2.5"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
        <label for="plantag" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Link to factor</label>
        <select id="plantag" value="{{pn.draft.factor}}" onChange="{{pn.draft.onFactor}}" style="min-height: 36px; border-radius: 8px; border: none; background: #2C2C2E; color: #FFFFFF; padding: 0 8px; font-size: 13px; font-weight: 600">
          <sc-for list="{{tagOpts}}" as="o" hint-placeholder-count="16"><option value="{{o.id}}">{{o.name}}</option></sc-for>
        </select>
      </div>
      <div style="background: #1C1C1E; border-radius: 20px; padding: 6px 16px 8px; display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 700; padding: 8px 0">{{pn.head}}</span>
        <sc-if value="{{pn.empty}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: #98989F; padding: 8px 0 10px; border-top: 1px solid #38383A">Nothing planned yet.</span></sc-if>
        <sc-for list="{{pn.tasks}}" as="t" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #38383A">
            <span style="width: 20px; height: 20px; border-radius: 12px; border: 2px solid #636366; flex: none"></span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 16px">{{t.text}}</span>
              <sc-if value="{{t.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #98989F">{{t.sub}}</span></sc-if>
            </div>
            <button onClick="{{t.del}}" aria-label="Delete task" style="width: 36px; height: 36px; background: transparent; border: none; color: #636366; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
        </sc-for>
      </div>
      <button onClick="{{toNote}}" style="min-height: 52px; border-radius: 14px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 17px; font-weight: 700">Continue</button>
    </div>
  </sc-if>

  <sc-if value="{{iv.isQ}}" hint-placeholder-val="{{true}}">

          </button>
          <sc-for list="{{d.tasks}}" as="t" hint-placeholder-count="2">

              <button onClick="{{t.toggle}}" aria-label="{{t.aria}}" aria-pressed="{{t.doneStr}}" style="width: 44px; height: 40px; margin-left: -10px; background: transparent; border: none; display: flex; align-items: center; justify-content: center; flex: none">

  <span style="font-size: 12px; color: #98989F; text-align: center; padding: 0 12px">Tap + to add a to-do for any day. Unfinished daily to-dos carry over to the next day, and linked ones show up on that factor's check-in page.</span>
</div>

<!-- ================= SETTINGS ================= -->
<sc-if value="{{show.settings}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 8px">

    <span style="font-size: 17px; font-weight: 700">Settings</span>
    <button onClick="{{st.save}}" style="justify-self: end; background: transparent; border: none; font-size: 17px; font-weight: 700; min-height: 44px; padding: 0; color: {{st.saveCol}}">Save</button>
  </div>
  <sc-if value="{{st.hasMsg}}" hint-placeholder-val="{{false}}"><div style="background: #1C1C1E; border-radius: 12px; padding: 10px 14px; font-size: 14px; color: {{st.msgCol}}">{{st.msg}}</div></sc-if>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Pillar Weights</span>

        <button onClick="{{w.inc}}" aria-label="{{w.incAria}}" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #2C2C2E; color: #409CFF; font-size: 20px; font-weight: 700">+</button>
      </div>
    </sc-for>
  </div>
  <span style="font-size: 13px; padding: 0 16px; color: {{st.wCol}}">{{st.wNote}}</span>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">This Week's Focus · pick 3</span>
  <div style="background: #1C1C1E; border-radius: 16px; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{st.focus}}" as="f" hint-placeholder-count="15">
      <button onClick="{{f.pick}}" aria-pressed="{{f.selStr}}" style="min-height: 40px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; padding: 0 6px; {{f.style}}">{{f.name}}</button>
    </sc-for>
  </div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Factors · name and default importance</span>

      <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; {{f.sep}}">
        <label for="{{f.inputId}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{f.label}}</label>
        <input id="{{f.inputId}}" type="text" value="{{f.name}}" onChange="{{f.onName}}" style="flex: 1; min-width: 0; min-height: 36px; border: none; border-radius: 8px; background: #2C2C2E; color: #FFFFFF; padding: 0 10px; font-size: 15px">

          <sc-for list="{{f.opts}}" as="o" hint-placeholder-count="3">
            <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 32px; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; {{o.style}}">{{o.short}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Reminder</span>
  <div style="background: #1C1C1E; border-radius: 16px; padding: 12px 14px; font-size: 15px; line-height: 1.45; color: #C7C7CC">Home-screen apps can't set alarms by themselves. In the iPhone <strong style="color: #FFFFFF">Reminders</strong> app, add "Better Days check-in," tap ⓘ, turn on <strong style="color: #FFFFFF">Time</strong> and set <strong style="color: #FFFFFF">Repeat: Daily</strong>.</div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Tip Sources · need internet</span>

    <sc-for list="{{st.sources}}" as="x" hint-placeholder-count="15">
      <div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; {{x.sep}}">
        <span style="font-size: 15px; font-weight: 600">{{x.name}}</span>
        <span style="font-size: 13px; color: #98989F; text-align: right">{{x.authors}}</span>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Change History</span>
  <div style="background: #1C1C1E; border-radius: 16px; padding: 0 14px">
    <sc-for list="{{st.hist}}" as="h" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; padding: 10px 0; {{h.sep}}">
        <span style="font-size: 13px; color: #98989F; min-width: 46px">{{h.date}}</span>
        <span style="font-size: 14px">{{h.txt}}</span>

  </div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Data</span>

      <a href="{{st.csv}}" download="day-score-export.csv" style="display: flex; align-items: center; min-height: 44px; border-top: 1px solid #38383A; color: #30D158; font-size: 15px; font-weight: 600; text-decoration: none">Download day-score-export.csv ›</a>
    </sc-if>
    <button onClick="{{st.del}}" style="width: 100%; min-height: 52px; background: transparent; border: none; border-top: 1px solid #38383A; color: #FF6961; font-size: 16px; text-align: left; padding: 0">{{st.delLabel}}</button>
  </div>

  <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F; padding: 12px 16px 0">Setup</span>

</div>

<!-- ================= COMPARE ================= -->
<sc-if value="{{show.compare}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #98989F">{{cmp.title}}</span>
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Compare</h1>
  </div>

  <sc-if value="{{notTwo}}" hint-placeholder-val="{{false}}">
    <div style="background: #1C1C1E; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 17px; font-weight: 700">Nothing to compare yet</span>
      <span style="font-size: 15px; color: #C7C7CC; line-height: 1.45">Compare shows your latest check-in next to the one before it. It fills in after your second check-in.</span>
      <button onClick="{{goInput}}" style="min-height: 50px; border-radius: 14px; border: none; background: #0A84FF; color: #FFFFFF; font-size: 17px; font-weight: 700">Go to Check-in</button>
    </div>
  </sc-if>
  <sc-if value="{{hasTwo}}" hint-placeholder-val="{{true}}">
  <div style="display: flex; flex-direction: column; gap: 12px">
  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.9fr; gap: 6px; font-size: 12px; font-weight: 600; color: #98989F">
      <span></span><span>{{cmp.thenShort}}</span><span>{{cmp.nowShort}}</span><span>Change</span>
    </div>
    <sc-for list="{{cmp.top}}" as="t" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.9fr; gap: 6px; align-items: center; padding-top: 8px; border-top: 1px solid #38383A">
        <span style="font-size: 15px; font-weight: {{t.weight}}">{{t.name}}</span>
        <span style="font-size: 15px; font-weight: 700; color: {{t.a.bg}}">{{t.a.pct}} {{t.a.letter}}</span>
        <span style="font-size: 15px; font-weight: 800; color: {{t.b.bg}}">{{t.b.pct}} {{t.b.letter}}</span>
        <span style="font-size: 14px; font-weight: 800; color: {{t.d.col}}">{{t.d.txt}}</span>
      </div>
    </sc-for>
  </div>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 15px; font-weight: 700">Expected vs. Actual · {{cmp.nowShort}}</span>
    <span style="font-size: 14px; color: #C7C7CC">{{cmp.expLine}}</span>
    <span style="font-size: 16px; font-weight: 800; color: {{cmp.ed.col}}">{{cmp.ed.txt}}</span>
  </div>

  <sc-for list="{{cmp.groups}}" as="g" hint-placeholder-count="3">
    <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 700">{{g.name}}</span>
      <div style="display: grid; grid-template-columns: 1.5fr 0.7fr 0.7fr 0.9fr 0.9fr; gap: 4px; font-size: 11px; font-weight: 600; color: #98989F">
        <span>Factor</span><span>Then</span><span>Now</span><span>Change</span><span>Imp.</span>
      </div>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 1.5fr 0.7fr 0.7fr 0.9fr 0.9fr; gap: 4px; align-items: center; font-size: 14px; padding: 6px 0; border-top: 1px solid #38383A">
          <span style="font-weight: 600">{{r.name}}</span>
          <span style="color: #C7C7CC">{{r.a}}</span>
          <span style="font-weight: 700">{{r.b}}</span>
          <span style="font-weight: 800; color: {{r.d.col}}">{{r.d.txt}}</span>
          <span style="font-size: 12px; color: #98989F">{{r.imp}}</span>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <div style="background: #1C1C1E; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 15px; font-weight: 700">Notes</span>
    <span style="font-size: 14px; color: #C7C7CC"><strong style="color: #FFFFFF">{{cmp.thenShort}}:</strong> {{cmp.noteThen}}</span>
    <span style="font-size: 14px; color: #C7C7CC"><strong style="color: #FFFFFF">{{cmp.nowShort}}:</strong> {{cmp.noteNow}}</span>
  </div>
  </div>
  </sc-if>
</div>

<!-- ================= HISTORY ================= -->
<sc-if value="{{show.history}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{prevMonth}}" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2C2C2E; color: #409CFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <span style="font-size: 17px; font-weight: 700">{{cal.title}}</span>
      <button onClick="{{nextMonth}}" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2C2C2E; color: #409CFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{cal.cells}}" as="c" hint-placeholder-count="35">

          <div style="height: 46px"></div>

        <sc-if value="{{c.real}}" hint-placeholder-val="{{true}}">
          <button onClick="{{c.pick}}" aria-label="{{c.aria}}" style="height: 46px; border-radius: 23px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; font-weight: 700; padding: 0; {{c.style}}">
            <span>{{c.num}}</span>
            <sc-if value="{{c.isLogged}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3.5"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
            <sc-if value="{{c.isMissed}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 3.5"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
          </button>
        </sc-if>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #C7C7CC; padding-top: 4px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #1E7B3A"></span>Logged</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #C4161C"></span>Missed</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 6px; border: 2px solid #409CFF"></span>Today</span>
    </div>
  </div>
  <span style="font-size: 13px; color: #98989F; text-align: center">Tap any day to see what you entered.</span>
</div>
</sc-if>

</div>

  <button onClick="{{goCompare}}" style="border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; color: {{tabc.compare}}"><svg width="24" height="24" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>Compare</button>
  <button onClick="{{goHistory}}" style="border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; color: {{tabc.history}}"><svg width="24" height="24" viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>History</button>

      onText: (ev) => this.patchAdd({ text: ev.target.value }), onFactor: (ev) => this.patchAdd({ factor: ev.target.value }),
      onKey: (ev) => { if (ev.key === 'Enter') this.submitAdd(); },
      submit: () => this.submitAdd(), cancel: () => this.patchAdd({ open: false })
    };

    const on = '#409CFF', off2 = '#8E8E93';
    return {
      show: { summary: s.tab === 'summary', input: s.tab === 'input', planner: s.tab === 'planner', compare: s.tab === 'compare', history: s.tab === 'history', settings: s.tab === 'settings' },
      showTabs: !(s.tab === 'input' && s.inp && s.inp.phase === 'q'), scrollPad: (s.tab === 'input' && s.inp && s.inp.phase === 'q') ? 'padding-bottom: env(safe-area-inset-bottom)' : '',
      st: st, su: su, ad: ad, openAdd: () => this.openAdd(), hasData: hasData, noData: !hasData, hasTwo: hasTwo, notTwo: !hasTwo, oneLogged: logged.length === 1,
      goSettings: () => this.setState({ tab: 'settings', sel: null, msg: '', delStep: 0, set: this.freshDraft() }),
      runSetup: () => this.setState({ setup: { step: 0 }, set: this.freshDraft(), msg: '' }),
      tabc: { summary: s.tab === 'summary' ? on : off2, input: s.tab === 'input' ? on : off2, planner: s.tab === 'planner' ? on : off2, compare: s.tab === 'compare' ? on : off2, history: s.tab === 'history' ? on : off2 },
      pl: pl, rv: rv, pn: pn, tagOpts: tagOpts,
      tipsOn: s.online, tipsOff: !s.online && latRecs.items.length > 0,
      offlineLabel: s.simOff ? 'Demo: turn internet back on' : 'Demo: see it without internet',
      toggleOffline: () => this.setState({ simOff: !this.state.simOff }),
      goPlanner: () => this.go('planner'),
      startQs: () => this.patchInp({ phase: 'q', fi: 0, act: 0, buf: '' }),
      toNote: () => this.patchInp({ phase: 'note' }),
      todayLabel: fmt(TODAY), lat: lat, week: week, highlights: highlights, sections: sections, filters: filters, big3: big3,
      latRecs: latRecs, latSafety: latSafety, openLatest: () => this.setState({ sel: lk }),
      iv: iv, res: res, keys: keys, cmp: cmp, cal: cal, sheet: sheet,
      goSummary: () => this.go('summary'), goInput: () => this.go('input'), goCompare: () => this.go('compare'), goHistory: () => this.go('history'),
      back: () => this.back(), next: () => this.next(), autoFill: () => this.autoFill(), save: () => this.save(),
      markNA: () => { if (!this.busy) this.commitScore('NA'); },
      onNote: (ev) => this.patchInp({ note: ev.target.value }),
      prevMonth: () => this.shiftMonth(-1), nextMonth: () => this.shiftMonth(1), closeSheet: () => this.setState({ sel: null })
    };
  }
}
